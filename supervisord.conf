[supervisord]
nodaemon=true
user=root

[program:vnc]
command=/bin/bash -c "su - ubuntu -c 'vncserver :1 -geometry 1280x800 -depth 24 -localhost no' "
autostart=true
autorestart=true
priority=10

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 8080
autostart=true
autorestart=true
priority=20
