[supervisord]
nodaemon=true
user=root

[program:vnc]
command=/bin/bash -c "su - ubuntu -c 'vncserver :1 -geometry 1280x800 -depth 24 -localhost no'"
autostart=true
autorestart=true
priority=10

[program:novnc]
command=/usr/bin/websockify --verbose --web=/usr/share/novnc 8080 localhost:5901
autostart=true
autorestart=true
priority=20
